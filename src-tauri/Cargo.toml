[package]
name = "KlaayGuard"
version = "0.1.12"
description = "KlaayGuard security agent. Reports device posture to Klaay."
authors = ["Klaay <support@klaay.com>"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/klaayinc/klaayguard"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klaay_guard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# default-features off drops native-tls (OpenSSL). Use rustls with the OS
# trust store, not the compiled-in webpki roots: employee machines behind a
# TLS-inspecting proxy (Zscaler, Netskope) trust a corporate root that only
# the OS store holds. Keep the non-TLS defaults the agent relies on: http2,
# charset, and macOS system-proxy detection.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "charset",
    "http2",
    "macos-system-configuration",
] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.27"
dirs = "5.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
# default-features off drops the OpenSSL transport. Use rustls with native
# roots (see reqwest above). Re-add the defaults we depend on: debug-images
# for symbolication of stripped release binaries, and release-health for
# session tracking. Both are lost when default features go off.
sentry = { version = "0.42.0", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "debug-images",
    "release-health",
    "reqwest",
    "rustls",
] }
keyring = "2"
semver = "1.0"
sha2 = "0.10"
# base64url for the PKCE verifier and its challenge (sign_in.rs).
base64 = "0.22"
hmac = "0.12"  # App-scoped hash of the machine id for stable Linux device identity
getrandom = "0.2"  # CSPRNG for the sign-in state nonce (reuses the version already in-tree)

[target.'cfg(unix)'.dependencies]
nix = "0.26"  # For Unix-specific system calls if needed

[target.'cfg(target_os = "linux")'.dependencies]
# Session-bus probe for a StatusNotifier host (tray support detection).
# Already in the tree through tauri-plugin-single-instance.
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
# Screen-lock policy lives in the registry. Pinned to the version embed-resource
# already brings into Cargo.lock, so this adds no new crate and no new
# cargo-audit surface.
winreg = "0.55"
# Password and lockout policy through NetUserModalsGet, which any user may
# call; `net accounts` wraps the same call but prints localized labels.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_NetworkManagement_NetManagement"] }


#[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Updater disabled

# Enable all Tauri features needed for each platform
[features]
default = []



