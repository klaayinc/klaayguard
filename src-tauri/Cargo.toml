[package]
name = "KlaayGuard"
version = "0.1.12"
description = "KlaayGuard security agent. Reports device posture to Klaay."
authors = ["Klaay <support@klaay.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klaay_guard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.27"
dirs = "5.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
# default-features off: the default transport links OpenSSL. rustls keeps the
# TLS stack in the binary current with releases instead of frozen in packages.
sentry = { version = "0.42.0", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
keyring = "2"
semver = "1.0"
sha2 = "0.10"
hmac = "0.12"  # App-scoped hash of the machine id for stable Linux device identity
getrandom = "0.2"  # CSPRNG for the sign-in state nonce (reuses the version already in-tree)

[target.'cfg(unix)'.dependencies]
nix = "0.26"  # For Unix-specific system calls if needed

[target.'cfg(target_os = "linux")'.dependencies]
# Session-bus probe for a StatusNotifier host (tray support detection).
# Already in the tree through tauri-plugin-single-instance.
zbus = "5"


#[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Updater disabled

# Enable all Tauri features needed for each platform
[features]
default = []



