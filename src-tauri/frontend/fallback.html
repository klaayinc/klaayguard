<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KlaayGuard</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0; padding: 2rem;
    display: flex; flex-direction: column; gap: 1rem;
  }
  h1 { font-size: 1.2rem; margin: 0; }
  p { margin: 0; line-height: 1.5; }
  .muted { opacity: 0.75; font-size: 0.9rem; }
  button {
    font-size: 1rem; padding: 0.6rem 1rem; border-radius: 6px;
    border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
    background: transparent; color: inherit; cursor: pointer;
  }
  button.primary {
    background: #2563eb; border-color: #2563eb; color: white;
  }
</style>
</head>
<body>
  <h1>KlaayGuard runs in the background</h1>
  <p>Your desktop does not show the KlaayGuard tray icon, so this window
     gives you the same controls.</p>
  <p class="muted">On GNOME, install and enable the "AppIndicator and
     KStatusNotifierItem Support" extension to get the tray icon. This
     window then stays away.</p>
  <button class="primary" id="sign-in">Sign in</button>
  <button id="hub">Open employee hub</button>
  <script>
    const invoke = window.__TAURI__?.core?.invoke;
    document.getElementById('sign-in').onclick = () => invoke && invoke('fallback_sign_in');
    document.getElementById('hub').onclick = () => invoke && invoke('fallback_employee_hub');
  </script>
</body>
</html>
