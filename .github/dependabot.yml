version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A major update arrives in its own pull request.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    # A major update arrives in its own pull request.
    groups:
      cargo:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
