name: "publish-package-repos"

# Rebuilds the signed apt and rpm repositories at https://pkg.klaay.com and
# deploys them to GitHub Pages (PROD-7007).
#
# It runs after every `publish` run on main finishes, as a run of its own. It
# is not a job inside release.yml, whose `cancel-in-progress` would cancel a
# repository publish waiting for its reviewer whenever the next push to main
# starts a new release run. workflow_dispatch republishes by hand (after a key
# change, say).
#
# Three jobs:
#
# * check needs no secret and no approval. It asks whether the latest
#   published release is already on pkg.klaay.com, so a publish run that
#   released nothing (cancelled, failed, already served) does not page a
#   reviewer.
# * build-sign runs in `release`, the only environment that holds
#   PACKAGE_SIGNING_KEY, and needs a reviewer's approval. It uploads the signed
#   site as a Pages artifact and nothing else.
# * deploy runs in `github-pages`, which GitHub limits to the default branch.
#   It never sees the key.
#
# Every run rebuilds the whole site from the GitHub release files: Pages
# replaces the site on each deploy, and nothing is committed to a branch.

on:
  workflow_run:
    workflows: ["publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-package-repos
  cancel-in-progress: false

jobs:
  check:
    name: Is the latest release on pkg.klaay.com?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"; echo "run by hand: republish"; exit 0
          fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if curl -fsS https://pkg.klaay.com/apt/dists/stable/main/binary-amd64/Packages \
               | grep -qx "Version: ${latest#v}"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"; echo "$latest is already on pkg.klaay.com"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"; echo "$latest is not on pkg.klaay.com yet"
          fi

  build-sign:
    name: Build and sign the package repositories
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    outputs:
      inrelease_sha256: ${{ steps.hashes.outputs.inrelease }}
      repomd_sha256: ${{ steps.hashes.outputs.repomd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository tools
        timeout-minutes: 15
        run: ./.github/scripts/apt-install.sh apt-utils createrepo-c rpm gnupg dpkg-dev

      # Published releases only: no drafts, no prereleases. The newest five keep
      # the site well under the Pages size limit and leave room to roll back.
      - name: Download the newest production packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # A release is skipped only when its asset list has no production .deb
        # and .rpm. A download that fails for any other reason (rate limit,
        # network) fails the job: a green run built without the newest release
        # would leave customers without it until the next release.
        run: |
          set -euo pipefail
          mkdir -p packages
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 30 --json tagName --jq '.[].tagName')
          kept=0; used=""
          for tag in $tags; do
            [ "$kept" -lt 5 ] || break
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if ! grep -q '_Linux_x86_64_production\.deb$' <<<"$assets" \
               || ! grep -q '_Linux_x86_64_production\.rpm$' <<<"$assets"; then
              echo "skipping $tag: no production .deb and .rpm"
              continue
            fi
            dir=$(mktemp -d)
            for attempt in 1 2 3; do
              if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" --clobber \
                   --pattern '*_Linux_x86_64_production.deb' --pattern '*_Linux_x86_64_production.rpm'; then
                break
              fi
              [ "$attempt" -lt 3 ] || { echo "download of $tag failed three times" >&2; exit 1; }
              sleep 15
            done
            mv "$dir"/* packages/
            rm -rf "$dir"
            kept=$((kept + 1)); used="$used $tag"
            echo "using $tag"
          done
          [ "$kept" -gt 0 ] || { echo "no release carries production Linux packages" >&2; exit 1; }
          case " $used " in
            *" $latest "*) echo "includes the latest release, $latest" ;;
            *) echo "the latest release $latest is not in the repository build ($used)" >&2; exit 1 ;;
          esac

      - name: Build and sign
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$PACKAGE_SIGNING_KEY" || { echo "PACKAGE_SIGNING_KEY is not set in the release environment" >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --quiet --import
          PACKAGE_SIGNING_KEY_ID=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          export PACKAGE_SIGNING_KEY_ID
          PREVIOUS_SITE=https://pkg.klaay.com ./.github/scripts/build-package-repos.sh site packages
          rm -rf "$GNUPGHOME"

      # What the deploy job must then see served, so it can tell this site from
      # the previous one.
      - name: Record the signed index hashes
        id: hashes
        run: |
          echo "inrelease=$(sha256sum site/apt/dists/stable/InRelease | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "repomd=$(sha256sum site/rpm/repodata/repomd.xml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to pkg.klaay.com
    needs: build-sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # The site is what every customer's package manager reads. Check that
      # pkg.klaay.com serves *this* build's signed indexes, not the previous
      # deploy's, before calling the job done. The Pages CDN caches for up to 10
      # minutes, so allow 20.
      - name: Check the published repository
        env:
          WANT_INRELEASE: ${{ needs.build-sign.outputs.inrelease_sha256 }}
          WANT_REPOMD: ${{ needs.build-sign.outputs.repomd_sha256 }}
        run: |
          set -euo pipefail
          served() { curl -fsS -H 'Cache-Control: no-cache' "https://pkg.klaay.com/$1" | sha256sum | cut -d' ' -f1; }
          for _ in $(seq 1 60); do
            got_in=$(served apt/dists/stable/InRelease || true)
            got_md=$(served rpm/repodata/repomd.xml || true)
            if [ "$got_in" = "$WANT_INRELEASE" ] && [ "$got_md" = "$WANT_REPOMD" ]; then
              echo "pkg.klaay.com serves this build (InRelease $got_in, repomd.xml $got_md)"
              curl -fsS -o /dev/null https://pkg.klaay.com/klaay.asc
              curl -fsS -o /dev/null https://pkg.klaay.com/rpm/repodata/repomd.xml.asc
              exit 0
            fi
            sleep 20
          done
          echo "after 20 minutes pkg.klaay.com still serves InRelease $got_in and repomd.xml $got_md, not $WANT_INRELEASE and $WANT_REPOMD" >&2
          exit 1
