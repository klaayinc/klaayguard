name: Installer artifacts

# Manual build of the Windows x64 NSIS installer and the signed, notarized
# macOS installers, uploaded as workflow artifacts for testing on real
# machines. Pick the platform with the `platform` input. Does NOT publish to customers and
# does NOT touch the release pipeline. It runs the same steps as
# release-windows.yml, so a green run here is the rehearsal for the release
# job. Run via:
#   gh workflow run windows-installer-artifact.yml --ref <branch> -f version=0.1.99
#
# arm64 is not built. The osquery fetch script is x64-only, and ci.yml never
# builds aarch64-pc-windows-msvc. An arm64 leg built green once on 2026-08-12
# from Git LFS sidecars; add it back when the fetch script takes a target.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the installer (x.y.z). Empty keeps the tree's version."
        required: false
        default: ""
        type: string
      platform:
        description: "windows, macos, linux, or all"
        required: false
        default: "windows"
        type: string
      arch:
        description: "macOS arch: arm64, x64, or both"
        required: false
        default: "arm64"
        type: string

permissions:
  contents: read
  # Only for the Azure OIDC login used by signing.
  id-token: write

jobs:
  windows:
    if: inputs.platform == 'windows' || inputs.platform == 'both' || inputs.platform == 'all'
    name: Windows x64 (${{ matrix.build }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        include:
          - build: development
            api_url: "http://localhost:3000"
            frontend_url: "http://localhost:5173"
          - build: staging
            api_url: "https://api.klaay.dev"
            frontend_url: "https://app.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"
            frontend_url: "https://app.klaay.com"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Prebuilt binary, as ci.yml does. cargo install compiles the CLI for
      # ten minutes on every run and the cargo cache does not cover it.
      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4

      - name: Check the osquery version agrees across platforms
        shell: bash
        run: |
          set -euo pipefail
          RAKE_VER=$(grep -oP 'OSQUERY_VERSION\s*=\s*"\K[0-9.]+' Rakefile)
          PS_VER=$(grep -oP '^\$version\s*=\s*"\K[0-9.]+' .github/scripts/fetch-osquery-windows.ps1)
          [ "$RAKE_VER" = "$PS_VER" ] || { echo "osquery version split: Rakefile $RAKE_VER, PowerShell $PS_VER" >&2; exit 1; }

      - name: Fetch osquery sidecar (Windows)
        shell: pwsh
        run: ./.github/scripts/fetch-osquery-windows.ps1

      - name: Verify sidecar binary (Windows x64)
        shell: bash
        run: |
          set -euo pipefail
          SIDECAR="src-tauri/vendor/klaayguard-osqueryi-x86_64-pc-windows-msvc.exe"
          test -f "$SIDECAR" || { echo "Missing Windows sidecar: $SIDECAR" >&2; exit 1; }
          SIZE=$(stat -c%s "$SIDECAR")
          [ "$SIZE" -gt 5000000 ] || { echo "Sidecar is only $SIZE bytes" >&2; exit 1; }
          [ "$(head -c 2 "$SIDECAR")" = "MZ" ] || { echo "Sidecar is not a PE executable" >&2; exit 1; }

      - name: Set bundle version
        if: inputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"; V="${V#v}"
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$V\"/" src-tauri/Cargo.toml
          grep -q "\"version\": \"$V\"" src-tauri/tauri.conf.json || { echo "tauri.conf.json version sync failed" >&2; exit 1; }
          grep -q "^version = \"$V\"" src-tauri/Cargo.toml || { echo "Cargo.toml version sync failed" >&2; exit 1; }

      - name: Build Windows installer (NSIS)
        env:
          KLAAY_ENV: ${{ matrix.build }}
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          VITE_FRONTEND_URL: ${{ matrix.frontend_url }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      # --- Signing (gated) --------------------------------------------------
      # Signing runs only when AZURE_TRUSTED_SIGNING_ENDPOINT is set. Without
      # it the installer is UNSIGNED, which is fine for a test machine.
      - name: Check signing configuration
        id: sign
        shell: bash
        env:
          TS_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          if [ -z "${TS_ENDPOINT:-}" ]; then
            echo "::warning::AZURE_TRUSTED_SIGNING_ENDPOINT not set; installer is UNSIGNED (test only)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.sign.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer (Azure Trusted Signing)
        if: steps.sign.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Validate installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer missing" }
          $v = "${{ inputs.version }}"
          if ($v -eq "") { $v = (Get-Content VERSION -Raw).Trim() }
          ./.github/scripts/validate-windows-nsis.ps1 -Installer $exe.FullName -Version $v.TrimStart("v")

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: klaayguard-windows-x64-${{ matrix.build }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    if: inputs.platform == 'macos' || inputs.platform == 'both' || inputs.platform == 'all'
    name: macOS ${{ matrix.arch }} (${{ matrix.build }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        arch: [arm64, x64]
        include:
          - build: development
            api_url: "http://localhost:3000"
            frontend_url: "http://localhost:5173"
          - build: staging
            api_url: "https://api.klaay.dev"
            frontend_url: "https://app.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"
            frontend_url: "https://app.klaay.com"
          - arch: arm64
            target: aarch64-apple-darwin
            bundle_dir: src-tauri/target/aarch64-apple-darwin
            artifact_suffix: macOS_arm64
          - arch: x64
            target: x86_64-apple-darwin
            bundle_dir: src-tauri/target/x86_64-apple-darwin
            artifact_suffix: macOS_x64
    steps:
      - name: Skip arch not requested
        id: want
        shell: bash
        run: |
          case "${{ inputs.arch }}" in
            both) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            "${{ matrix.arch }}") echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'

      - name: Install Rust stable
        if: steps.want.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        if: steps.want.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}-${{ matrix.build }}

      - name: Install tauri-cli
        if: steps.want.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4

      - name: Fetch osquery sidecars (macOS)
        if: steps.want.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rake

      - name: Set bundle version
        if: steps.want.outputs.run == 'true' && inputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"; V="${V#v}"
          sed -i '' -E "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          sed -i '' -E "s/^version = \"[^\"]*\"/version = \"$V\"/" src-tauri/Cargo.toml
          grep -q "\"version\": \"$V\"" src-tauri/tauri.conf.json || { echo "tauri.conf.json version sync failed" >&2; exit 1; }
          grep -q "^version = \"$V\"" src-tauri/Cargo.toml || { echo "Cargo.toml version sync failed" >&2; exit 1; }

      - name: Import Apple Developer certificate
        if: steps.want.outputs.run == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain | grep -q "Developer ID Application"

      - name: Build Tauri (signed, notarized app + dmg)
        if: steps.want.outputs.run == 'true'
        env:
          KLAAY_ENV: ${{ matrix.build }}
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          VITE_FRONTEND_URL: ${{ matrix.frontend_url }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Build, sign, and notarize the .pkg installer
        if: steps.want.outputs.run == 'true'
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"; V="${V#v}"; [ -n "$V" ] || V=$(cat VERSION)
          mkdir -p out
          APP_PATH=$(find ${{ matrix.bundle_dir }} -path "*/bundle/macos/KlaayGuard.app" -type d | head -n1)
          test -n "$APP_PATH" || { echo "KlaayGuard.app missing" >&2; exit 1; }
          DMG=$(find ${{ matrix.bundle_dir }} -path "*/bundle/dmg/*" -name "*.dmg" -type f | head -n1)
          test -n "$DMG" || { echo "dmg missing" >&2; exit 1; }
          cp "$DMG" "out/KlaayGuard_${V}_${{ matrix.artifact_suffix }}_${{ matrix.build }}.dmg"

          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > installer_certificate.p12
          security import installer_certificate.p12 -k build.keychain \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          INSTALLER_ID=$(security find-identity -v build.keychain | grep "Developer ID Installer" | head -n1 | awk -F'"' '{print $2}')
          test -n "$INSTALLER_ID" || { echo "No Developer ID Installer identity" >&2; exit 1; }
          PKG="out/KlaayGuard_${V}_${{ matrix.artifact_suffix }}_${{ matrix.build }}.pkg"
          INSTALLER_SIGNING_IDENTITY="$INSTALLER_ID" \
            bash src-tauri/scripts/build-macos-pkg.sh "$APP_PATH" "$V" "$PKG"
          xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$PKG"
          ls -l out

      - name: Upload installers
        if: steps.want.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: klaayguard-macos-${{ matrix.arch }}-${{ matrix.build }}
          path: out/*
          if-no-files-found: error

  linux:
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    name: Linux x86_64 (${{ matrix.build }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        include:
          - build: development
            api_url: "http://localhost:3000"
            frontend_url: "http://localhost:5173"
          - build: staging
            api_url: "https://api.klaay.dev"
            frontend_url: "https://app.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"
            frontend_url: "https://app.klaay.com"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-unknown-linux-gnu-${{ matrix.build }}

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ruby ruby-rake desktop-file-utils

      - name: Fetch osquery sidecar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rake

      - name: Set bundle version
        if: inputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"; V="${V#v}"
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$V\"/" src-tauri/Cargo.toml
          grep -q "\"version\": \"$V\"" src-tauri/tauri.conf.json || { echo "tauri.conf.json version sync failed" >&2; exit 1; }
          grep -q "^version = \"$V\"" src-tauri/Cargo.toml || { echo "Cargo.toml version sync failed" >&2; exit 1; }

      - name: Build Tauri (Linux x86_64)
        env:
          KLAAY_ENV: ${{ matrix.build }}
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          VITE_FRONTEND_URL: ${{ matrix.frontend_url }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: cargo tauri build --bundles deb rpm appimage

      - name: Validate and collect
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"; V="${V#v}"; [ -n "$V" ] || V=$(cat VERSION)
          BASE_DIR="src-tauri/target/release/bundle"
          APPIMAGE=$(find "$BASE_DIR/appimage" -type f -name "*.AppImage" | head -n1); test -n "$APPIMAGE"
          DEB=$(find "$BASE_DIR/deb" -type f -name "*.deb" | head -n1); test -n "$DEB"
          RPM=$(find "$BASE_DIR/rpm" -type f -name "*.rpm" | head -n1); test -n "$RPM"
          ./.github/scripts/validate-linux-deb.sh "$DEB"
          mkdir -p out
          cp "$APPIMAGE" "out/KlaayGuard_${V}_Linux_x86_64_${{ matrix.build }}.AppImage"
          cp "$DEB" "out/KlaayGuard_${V}_Linux_x86_64_${{ matrix.build }}.deb"
          cp "$RPM" "out/KlaayGuard_${V}_Linux_x86_64_${{ matrix.build }}.rpm"
          ls -l out

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: klaayguard-linux-x86_64-${{ matrix.build }}
          path: out/*
          if-no-files-found: error
