name: Windows installer artifact

# Manual build of the Windows NSIS installer, uploaded as a workflow artifact for
# testing in a VM. Does NOT publish to customers. Run via:
#   gh workflow run windows-installer-artifact.yml --ref enable-windows-builds
on:
  workflow_dispatch:
  push:
    branches: [enable-windows-builds]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Fetch osquery sidecar (Windows)
        shell: pwsh
        run: ./.github/scripts/fetch-osquery-windows.ps1

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "=2.11.4" --locked

      - name: Build Windows installer (NSIS)
        env:
          KLAAY_ENV: production
          VITE_API_BASE_URL: https://api.klaay.com
          VITE_EARTHENWARE_URL: https://app.klaay.com
        run: cargo tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: klaayguard-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
