name: Windows installer artifact

# Manual build of the Windows NSIS installer for x64 and arm64, uploaded as
# workflow artifacts for testing on real machines. Does NOT publish to customers
# and does NOT touch the release pipeline. Signing runs only when the Azure
# Trusted Signing secrets exist; without them the installer is UNSIGNED and must
# not ship. Run via:
#   gh workflow run windows-installer-artifact.yml --ref <branch>
on:
  workflow_dispatch:
  push:
    branches: [enable-windows-builds]

# id-token: write is needed only for the Azure OIDC login used by signing.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 builds natively on the standard Windows runner.
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          # arm64 builds natively on an arm64 runner, so there is no cross-link
          # step. If windows-11-arm is unavailable, switch this to windows-latest
          # and cross-compile (the arm64 MSVC components must then be present).
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Fetch osquery sidecar (Windows)
        shell: pwsh
        run: ./.github/scripts/fetch-osquery-windows.ps1

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "=2.11.4" --locked

      - name: Verify osquery sidecar exists (Windows ${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          SIDECAR="src-tauri/vendor/klaayguard-osqueryi-${{ matrix.target }}.exe"
          test -f "$SIDECAR" || { echo "Missing Windows sidecar: $SIDECAR"; exit 1; }
          # A 133-byte Git LFS pointer means LFS did not resolve; fail loudly
          # rather than bundle a text file as the osquery binary.
          if head -c 128 "$SIDECAR" | grep -q "git-lfs"; then
            echo "Sidecar is an unresolved Git LFS pointer: $SIDECAR"; exit 1
          fi

      - name: Build Windows installer (NSIS)
        env:
          KLAAY_ENV: production
          VITE_API_BASE_URL: https://api.klaay.com
          VITE_FRONTEND_URL: https://app.klaay.com
        run: cargo tauri build --target ${{ matrix.target }} --bundles nsis

      # --- Signing (gated) ------------------------------------------------------
      # Signing runs only when AZURE_TRUSTED_SIGNING_ENDPOINT is set. Until the
      # Klaay organization Trusted Signing account exists, these steps are skipped
      # and the installer is UNSIGNED (fine for VM testing, never for customers).
      - name: Check signing configuration
        id: sign
        shell: bash
        env:
          TS_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          if [ -z "${TS_ENDPOINT:-}" ]; then
            echo "::warning::AZURE_TRUSTED_SIGNING_ENDPOINT not set — installer is UNSIGNED (test only)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.sign.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer (Azure Trusted Signing)
        if: steps.sign.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: src-tauri/target/${{ matrix.target }}/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: klaayguard-windows-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
