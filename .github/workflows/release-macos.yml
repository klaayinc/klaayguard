name: "release-macos"

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  build-upload:
    name: macOS ${{ matrix.arch }} (${{ matrix.build }})
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        arch: [arm64, x64]
        include:
          - build: development
            api_url: "http://localhost:3000"
            frontend_url: "http://localhost:5173"
          - build: staging
            api_url: "https://api.klaay.dev"
            frontend_url: "https://app.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"
            frontend_url: "https://app.klaay.com"
          - arch: arm64
            target: aarch64-apple-darwin
            dmg_dir: src-tauri/target/aarch64-apple-darwin
            artifact_suffix: macOS_arm64
          - arch: x64
            target: x86_64-apple-darwin
            dmg_dir: src-tauri/target/x86_64-apple-darwin
            artifact_suffix: macOS_x64
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: install tauri-cli
        run: cargo install tauri-cli --version "=2.11.4" --locked

      - name: Setup osquery binaries (macOS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rake

      - name: Verify sidecar binaries exist (macOS)
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing vendor sidecars:"
          ls -l src-tauri/vendor || true
          test -f src-tauri/vendor/klaayguard-osqueryi-aarch64-apple-darwin || (echo "Missing macOS arm64 sidecar" && exit 1)
          test -f src-tauri/vendor/klaayguard-osqueryi-x86_64-apple-darwin || (echo "Missing macOS x64 sidecar" && exit 1)

      - name: Set bundle version from release
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          sed -i '' -E "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          sed -i '' -E "s/^version = \"[^\"]*\"/version = \"$V\"/" src-tauri/Cargo.toml

      - name: (Mac) Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: (Mac) Verify Certificate
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "CERT_ID is $CERT_ID"
          echo "Certificate imported."

      - name: Build Tauri (macOS)
        env:
          KLAAY_ENV: ${{ matrix.build }}
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          VITE_FRONTEND_URL: ${{ matrix.frontend_url }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri build --target ${{ matrix.target }}

      - name: (Mac) Build, sign & notarize .pkg installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # The .pkg needs a "Developer ID Installer" identity, which is separate
          # from the "Developer ID Application" cert used to sign the .app. If it
          # isn't configured yet, skip the installer — the DMG still ships.
          if [ -z "${APPLE_INSTALLER_CERTIFICATE:-}" ]; then
            echo "::notice::APPLE_INSTALLER_CERTIFICATE not set — skipping .pkg installer (DMG still shipped)."
            exit 0
          fi

          APP_PATH=$(find ${{ matrix.dmg_dir }} -path "*/bundle/macos/KlaayGuard.app" -type d | head -n1 || true)
          if [ -z "${APP_PATH:-}" ]; then
            echo "::error::Built KlaayGuard.app not found under ${{ matrix.dmg_dir }}; cannot build .pkg"
            exit 1
          fi

          # Import the Developer ID Installer cert into the keychain created earlier.
          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > installer_certificate.p12
          security import installer_certificate.p12 -k build.keychain \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          INSTALLER_ID=$(security find-identity -v build.keychain | grep "Developer ID Installer" | head -n1 | awk -F'"' '{print $2}')
          if [ -z "${INSTALLER_ID:-}" ]; then
            echo "::error::No 'Developer ID Installer' identity found in keychain"
            exit 1
          fi
          echo "Installer identity: $INSTALLER_ID"

          PKG="KlaayGuard_${VERSION}_${{ matrix.artifact_suffix }}_${{ matrix.build }}.pkg"
          INSTALLER_SIGNING_IDENTITY="$INSTALLER_ID" \
            bash src-tauri/scripts/build-macos-pkg.sh "$APP_PATH" "${VERSION#v}" "$PKG"

          echo "Notarizing $PKG"
          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$PKG"

          gh release upload "$RELEASE_TAG" "$PKG" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded $PKG"

      - name: Rename and upload artifacts (macOS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          uploaded=()

          echo "Looking for macOS DMG first (deterministic paths)"
          DMG_PATH=$(find ${{ matrix.dmg_dir }} -path "*/bundle/dmg/*" -name "*.dmg" -type f | head -n1 || true)
          if [ -z "${DMG_PATH:-}" ]; then
            echo "Fallback: search any DMG under ${{ matrix.dmg_dir }}"
            DMG_PATH=$(find ${{ matrix.dmg_dir }} -name "*.dmg" -type f | head -n1 || true)
          fi
          if [ -n "${DMG_PATH:-}" ]; then
            RENAMED_DMG="KlaayGuard_${VERSION}_${{ matrix.artifact_suffix }}_${{ matrix.build }}.dmg"
            cp "$DMG_PATH" "$RENAMED_DMG"
            uploaded+=("$RENAMED_DMG")
            echo "Added to upload: $RENAMED_DMG"
          else
            echo "DMG not found; attempting .app.tar.gz fallback"
            APP_TGZ_PATH=$(find ${{ matrix.dmg_dir }} -type f -name "KlaayGuard.app.tar.gz" | head -n1 || true)
            if [ -n "${APP_TGZ_PATH:-}" ]; then
              RENAMED_TGZ="KlaayGuard_${VERSION}_${{ matrix.artifact_suffix }}_${{ matrix.build }}.app.tar.gz"
              cp "$APP_TGZ_PATH" "$RENAMED_TGZ"
              uploaded+=("$RENAMED_TGZ")
              echo "Added to upload: $RENAMED_TGZ"
            else
              echo "No macOS artifact found"
            fi
          fi

          if [ ${#uploaded[@]} -gt 0 ]; then
            echo "Uploading to release $RELEASE_TAG in $GITHUB_REPOSITORY: ${uploaded[*]}"
            gh release upload "$RELEASE_TAG" "${uploaded[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No artifacts found to upload for macOS ${{ matrix.arch }} ${{ matrix.build }}"
          fi
