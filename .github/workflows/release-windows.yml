name: "release-windows"

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  build-upload-windows:
    name: Windows x64 (${{ matrix.build }})
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        include:
          - build: development
            api_url: "http://localhost:3000"
            earthenware_url: "http://localhost:5173"
          - build: staging
            api_url: "https://api.klaay.dev"
            earthenware_url: "https://app.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"
            earthenware_url: "https://app.klaay.com"
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: (Windows) install NSIS and WiX bundlers
        shell: pwsh
        run: |
          choco install nsis -y --no-progress | Out-Null
          choco install wixtoolset -y --no-progress | Out-Null

      - name: install frontend dependencies
        run: yarn install

      - name: Setup osquery binary (Windows via GitHub Releases)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Read OSQUERY_VERSION from Rakefile to stay in sync
          $rake = Get-Content Rakefile -Raw
          $m = Select-String -InputObject $rake -Pattern 'OSQUERY_VERSION\s*=\s*"([0-9\.]+)"' -AllMatches | Select-Object -First 1
          if (-not $m) { throw "Unable to parse OSQUERY_VERSION from Rakefile" }
          $ver = $m.Matches[0].Groups[1].Value
          Write-Host "Using OSQUERY_VERSION=$ver"

          $tagUrl = "https://api.github.com/repos/osquery/osquery/releases/tags/$ver"
          $json = Invoke-RestMethod -Uri $tagUrl
          if (-not $json.assets) { throw "No assets found for osquery $ver" }
          $asset = $json.assets | Where-Object { $_.name -match "windows_x86_64\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "No windows_x86_64.zip asset for osquery $ver" }
          # Download checksum file if present and verify zip
          $shaAsset = $json.assets | Where-Object { $_.name -match "sha256" } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          $zipPath = "tmp/osquery-windows_x86_64-$ver.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          if ($shaAsset) {
            $shaPath = "tmp/" + $shaAsset.name
            Invoke-WebRequest -Uri $shaAsset.browser_download_url -OutFile $shaPath
            $expected = (Get-Content $shaPath) | ForEach-Object { if ($_ -match "([0-9a-fA-F]{64}).*windows_x86_64.zip") { $Matches[1].ToLower() } }
            if (-not $expected) { Write-Host "No matching checksum line found for windows_x86_64.zip" } else {
              $actual = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
              if ($actual -ne $expected) { throw "Checksum mismatch for osquery windows zip: expected $expected got $actual" }
              Write-Host "Verified checksum for Windows zip"
            }
          }
          Expand-Archive -Path $zipPath -DestinationPath tmp/osquery -Force
          $src = Get-ChildItem -Path tmp/osquery -Recurse -Filter osqueryd.exe | Select-Object -First 1
          if (-not $src) { throw "osqueryd.exe not found in expanded archive" }
          New-Item -ItemType Directory -Force -Path src-tauri/vendor | Out-Null
          Copy-Item -Force $src.FullName "src-tauri/vendor/osqueryi-x86_64-pc-windows-msvc.exe"
          Write-Host "Prepared Windows sidecar from GitHub Releases"

      - name: Verify sidecar binary exists (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path "src-tauri/vendor/osqueryi-x86_64-pc-windows-msvc.exe")) { throw "Missing Windows x64 sidecar" }

      - name: Sync version across all files
        run: yarn sync-version

      - name: Build Tauri (Windows)
        shell: pwsh
        env:
          KLAAY_ENV: ${{ matrix.build }}
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          VITE_EARTHENWARE_URL: ${{ matrix.earthenware_url }}
          VITE_SENTRY_DSN: https://64638a7824bb887830771961508ba5ce@o4508818952290304.ingest.us.sentry.io/4510048565067776
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          yarn tauri:build

      - name: Rename and upload artifacts (Windows)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $uploaded = @()
          $base = "src-tauri/target/release/bundle"

          # Prefer MSI, fallback to NSIS exe
          $msi = Get-ChildItem -Path "$base/msi" -Filter *.msi -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $renamed = "KlaayGuard_${env:VERSION}_Windows_x64_${{ matrix.build }}.msi"
            Copy-Item $msi.FullName $renamed -Force
            $uploaded += $renamed
            Write-Host "Added to upload: $renamed"
          } else {
            $nsis = Get-ChildItem -Path "$base/nsis" -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($nsis) {
              $renamed = "KlaayGuard_${env:VERSION}_Windows_x64_${{ matrix.build }}.exe"
              Copy-Item $nsis.FullName $renamed -Force
              $uploaded += $renamed
              Write-Host "Added to upload: $renamed"
            } else {
              Write-Host "No Windows installer artifact found"
            }
          }

          if ($uploaded.Count -gt 0) {
            gh release upload "$env:RELEASE_TAG" $uploaded --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            Write-Host "No artifacts found to upload for Windows ${{ matrix.build }}"
          }


