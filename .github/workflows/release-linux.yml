name: "release-linux"

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  build-upload-linux-x86_64:
    name: Linux x86_64 (${{ matrix.build }})
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        include:
          - build: development
            api_url: "http://localhost:3000"
            earthenware_url: "http://localhost:5173"
          - build: staging
            api_url: "https://api.klaay.dev"
            earthenware_url: "https://app.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"
            earthenware_url: "https://app.klaay.com"
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: (Ubuntu) install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: yarn install

      - name: Setup osquery binaries (Linux)
        run: yarn setup-osquery

      - name: Verify sidecar binaries exist (Linux x86_64)
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing vendor sidecars:"
          ls -l src-tauri/vendor || true
          test -f src-tauri/vendor/osqueryi-x86_64-unknown-linux-gnu || (echo "Missing Linux x86_64 sidecar" && exit 1)

      - name: Sync version across all files
        run: yarn sync-version

      - name: Build Tauri (Linux x86_64)
        env:
          KLAAY_ENV: ${{ matrix.build }}
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          VITE_EARTHENWARE_URL: ${{ matrix.earthenware_url }}
          VITE_SENTRY_DSN: https://64638a7824bb887830771961508ba5ce@o4508818952290304.ingest.us.sentry.io/4510048565067776
        run: |
          yarn tauri:build --bundles deb rpm

      - name: Rename and upload artifacts (Linux x86_64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          uploaded=()
          BASE_DIR="src-tauri/target/release/bundle"

          # AppImage
          APPIMAGE=$(find "$BASE_DIR/appimage" -type f -name "*.AppImage" | head -n1 || true)
          if [ -n "${APPIMAGE:-}" ]; then
            RENAMED_APPIMAGE="KlaayGuard_${VERSION}_Linux_x86_64_${{ matrix.build }}.AppImage"
            cp "$APPIMAGE" "$RENAMED_APPIMAGE"
            uploaded+=("$RENAMED_APPIMAGE")
            echo "Added to upload: $RENAMED_APPIMAGE"
          fi
          # deb
          DEB=$(find "$BASE_DIR/deb" -type f -name "*.deb" | head -n1 || true)
          if [ -n "${DEB:-}" ]; then
            RENAMED_DEB="KlaayGuard_${VERSION}_Linux_x86_64_${{ matrix.build }}.deb"
            cp "$DEB" "$RENAMED_DEB"
            uploaded+=("$RENAMED_DEB")
            echo "Added to upload: $RENAMED_DEB"
          fi
          # rpm
          RPM=$(find "$BASE_DIR/rpm" -type f -name "*.rpm" | head -n1 || true)
          if [ -n "${RPM:-}" ]; then
            RENAMED_RPM="KlaayGuard_${VERSION}_Linux_x86_64_${{ matrix.build }}.rpm"
            cp "$RPM" "$RENAMED_RPM"
            uploaded+=("$RENAMED_RPM")
            echo "Added to upload: $RENAMED_RPM"
          fi

          if [ ${#uploaded[@]} -gt 0 ]; then
            echo "Uploading to release $RELEASE_TAG in $GITHUB_REPOSITORY: ${uploaded[*]}"
            gh release upload "$RELEASE_TAG" "${uploaded[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No artifacts found to upload for Linux x86_64 ${{ matrix.build }}"
          fi

  build-upload-linux-arm64:
    name: Linux arm64 (${{ matrix.build }})
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        include:
          - build: development
            api_url: "http://localhost:3000"
            earthenware_url: "http://localhost:5173"
          - build: staging
            api_url: "https://api.klaay.dev"
            earthenware_url: "https://app.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"
            earthenware_url: "https://app.klaay.com"
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: (Ubuntu) install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: (Ubuntu arm64) install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: install frontend dependencies
        run: yarn install

      - name: Setup osquery binaries (Linux)
        run: yarn setup-osquery

      - name: Verify sidecar binaries exist (Linux arm64)
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing vendor sidecars:"
          ls -l src-tauri/vendor || true
          test -f src-tauri/vendor/osqueryi-aarch64-unknown-linux-gnu || (echo "Missing Linux aarch64 sidecar" && exit 1)

      - name: Sync version across all files
        run: yarn sync-version

      - name: Build Tauri (Linux arm64)
        env:
          KLAAY_ENV: ${{ matrix.build }}
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          VITE_EARTHENWARE_URL: ${{ matrix.earthenware_url }}
          VITE_SENTRY_DSN: https://64638a7824bb887830771961508ba5ce@o4508818952290304.ingest.us.sentry.io/4510048565067776
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          yarn tauri:build --target aarch64-unknown-linux-gnu --bundles deb rpm

      - name: Rename and upload artifacts (Linux arm64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          uploaded=()
          BASE_DIR="src-tauri/target/aarch64-unknown-linux-gnu/release/bundle"

          # deb
          DEB=$(find "$BASE_DIR/deb" -type f -name "*.deb" | head -n1 || true)
          if [ -n "${DEB:-}" ]; then
            RENAMED_DEB="KlaayGuard_${VERSION}_Linux_arm64_${{ matrix.build }}.deb"
            cp "$DEB" "$RENAMED_DEB"
            uploaded+=("$RENAMED_DEB")
            echo "Added to upload: $RENAMED_DEB"
          fi
          # rpm
          RPM=$(find "$BASE_DIR/rpm" -type f -name "*.rpm" | head -n1 || true)
          if [ -n "${RPM:-}" ]; then
            RENAMED_RPM="KlaayGuard_${VERSION}_Linux_arm64_${{ matrix.build }}.rpm"
            cp "$RPM" "$RENAMED_RPM"
            uploaded+=("$RENAMED_RPM")
            echo "Added to upload: $RENAMED_RPM"
          fi

          if [ ${#uploaded[@]} -gt 0 ]; then
            echo "Uploading to release $RELEASE_TAG in $GITHUB_REPOSITORY: ${uploaded[*]}"
            gh release upload "$RELEASE_TAG" "${uploaded[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No artifacts found to upload for Linux arm64 ${{ matrix.build }}"
          fi
