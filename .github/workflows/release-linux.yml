name: "release-linux"

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  build-upload-linux-x86_64:
    name: Linux x86_64 (${{ matrix.build }})
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        include:
          - build: development
            api_url: "http://localhost:3000"
            frontend_url: "http://localhost:5173"
          - build: staging
            api_url: "https://api.klaay.dev"
            frontend_url: "https://app.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"
            frontend_url: "https://app.klaay.com"
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install tauri-cli
        run: cargo install tauri-cli --version "=2.11.4" --locked

      - name: (Ubuntu) install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ruby ruby-rake desktop-file-utils

      - name: Setup osquery binaries (Linux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rake

      - name: Verify sidecar binaries exist (Linux x86_64)
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing vendor sidecars:"
          ls -l src-tauri/vendor || true
          test -f src-tauri/vendor/klaayguard-osqueryi-x86_64-unknown-linux-gnu || (echo "Missing Linux x86_64 sidecar" && exit 1)

      - name: Set bundle version from release
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$V\"/" src-tauri/Cargo.toml

      - name: Build Tauri (Linux x86_64)
        env:
          KLAAY_ENV: ${{ matrix.build }}
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          VITE_FRONTEND_URL: ${{ matrix.frontend_url }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          cargo tauri build --bundles deb rpm appimage

      - name: Rename and upload artifacts (Linux x86_64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          uploaded=()
          BASE_DIR="src-tauri/target/release/bundle"

          # Every format must exist. A missing artifact must fail the job:
          # a partial upload becomes a published release that customers see.
          APPIMAGE=$(find "$BASE_DIR/appimage" -type f -name "*.AppImage" | head -n1)
          test -n "$APPIMAGE" || { echo "AppImage missing" >&2; exit 1; }
          # tauri-bundler downloads its AppImage plugin at build time and, if
          # that fails, silently falls back to the legacy runtime, which needs
          # libfuse.so.2. Stock Ubuntu, Debian and Fedora no longer ship it,
          # so that build starts nowhere. Only the static type2 runtime ships.
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-version 2>&1 | grep -q 'type2-runtime' \
            || { echo "AppImage was built with the legacy fuse2 runtime" >&2; exit 1; }
          DEB=$(find "$BASE_DIR/deb" -type f -name "*.deb" | head -n1)
          test -n "$DEB" || { echo "deb missing" >&2; exit 1; }
          RPM=$(find "$BASE_DIR/rpm" -type f -name "*.rpm" | head -n1)
          test -n "$RPM" || { echo "rpm missing" >&2; exit 1; }

          ./.github/scripts/validate-linux-deb.sh "$DEB"

          RENAMED_APPIMAGE="KlaayGuard_${VERSION}_Linux_x86_64_${{ matrix.build }}.AppImage"
          cp "$APPIMAGE" "$RENAMED_APPIMAGE"
          uploaded+=("$RENAMED_APPIMAGE")
          RENAMED_DEB="KlaayGuard_${VERSION}_Linux_x86_64_${{ matrix.build }}.deb"
          cp "$DEB" "$RENAMED_DEB"
          uploaded+=("$RENAMED_DEB")
          RENAMED_RPM="KlaayGuard_${VERSION}_Linux_x86_64_${{ matrix.build }}.rpm"
          cp "$RPM" "$RENAMED_RPM"
          uploaded+=("$RENAMED_RPM")

          echo "Uploading to release $RELEASE_TAG in $GITHUB_REPOSITORY: ${uploaded[*]}"
          gh release upload "$RELEASE_TAG" "${uploaded[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # Linux arm64 builds removed (disabled)
