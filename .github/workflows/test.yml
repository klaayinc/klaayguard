name: Rust unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Rust unit tests (ubuntu-latest, stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup environment files
        run: scripts/setup-env.sh

      # Run checks (formatting, linting with -D warnings, tests)
      # Note: bin/check runs clippy with -D warnings to treat all warnings as errors
      - name: Run checks (formatting, linting, tests)
        run: bin/check
