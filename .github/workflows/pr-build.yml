name: "pr-build"

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 (development)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            package-lock.json
            pnpm-lock.yaml

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.3

      - name: Enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: (Ubuntu) install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: yarn install

      - name: Setup osquery binaries (Linux)
        run: yarn setup-osquery

      - name: Verify sidecar binaries exist (Linux x86_64)
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing vendor sidecars:"
          ls -l src-tauri/vendor || true
          test -f src-tauri/vendor/osqueryi-x86_64-unknown-linux-gnu || (echo "Missing Linux x86_64 sidecar" && exit 1)

      - name: Sync version across all files
        run: yarn sync-version

      - name: Build Tauri (Linux x86_64)
        env:
          KLAAY_ENV: development
          VITE_API_BASE_URL: https://api.klaay.dev
          VITE_EARTHENWARE_URL: https://app.klaay.dev
          VITE_SENTRY_DSN: https://64638a7824bb887830771961508ba5ce@o4508818952290304.ingest.us.sentry.io/4510048565067776
        run: |
          yarn tauri:build --bundles deb rpm

      - name: Upload build artifacts (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-linux-bundles
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: ignore

  macos:
    name: macOS (arm64 + x64, development)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            package-lock.json
            pnpm-lock.yaml

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.3

      - name: Enable sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: install frontend dependencies
        run: yarn install

      - name: Setup osquery binaries (macOS)
        run: yarn setup-osquery

      - name: Verify sidecar binaries exist (macOS)
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing vendor sidecars:"
          ls -l src-tauri/vendor || true
          test -f src-tauri/vendor/osqueryi-aarch64-apple-darwin || (echo "Missing macOS arm64 sidecar" && exit 1)
          test -f src-tauri/vendor/osqueryi-x86_64-apple-darwin || (echo "Missing macOS x64 sidecar" && exit 1)

      - name: Sync version across all files
        run: yarn sync-version

      - name: Build Tauri (macOS)
        env:
          KLAAY_ENV: development
          VITE_API_BASE_URL: https://api.klaay.dev
          VITE_EARTHENWARE_URL: https://app.klaay.dev
          VITE_SENTRY_DSN: https://64638a7824bb887830771961508ba5ce@o4508818952290304.ingest.us.sentry.io/4510048565067776
        run: |
          yarn tauri:build --target aarch64-apple-darwin
          yarn tauri:build --target x86_64-apple-darwin

      - name: Upload build artifacts (macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-macos-bundles
          path: |
            src-tauri/target/aarch64-apple-darwin/**/bundle/**
            src-tauri/target/x86_64-apple-darwin/**/bundle/**
          if-no-files-found: ignore
