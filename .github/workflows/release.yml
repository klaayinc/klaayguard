name: "publish"

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      version: ${{ steps.set_tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Compute version and tag
        id: set_tag
        run: |
          VERSION=$(cat VERSION)
          TAG="app-v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - name: Create draft release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.set_tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.set_tag.outputs.tag }} already exists"
          else
            gh release create "${{ steps.set_tag.outputs.tag }}" \
              --title "KlaayGuard v${{ steps.set_tag.outputs.version }}" \
              --notes "See the assets to download this version and install." \
              --draft
          fi

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        platform: [macos-arm, macos-x64, ubuntu]
        include:
          - platform: macos-arm # for Arm based macs (M1 and above).
            runner: macos-latest
            args: "--target aarch64-apple-darwin --bundles app"
          - platform: macos-x64 # for Intel based macs.
            runner: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu
            runner: ubuntu-22.04
            args: ""

          - build: development
            api_url: "http://localhost:3000"
          - build: staging
            api_url: "https://api.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"

          # - platform: windows
          #   runner: windows-latest
          #   args: ""
          #

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: (Ubuntu) install dependencies
        if: ${{ matrix.runner == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: install frontend dependencies
        run: yarn install # change this to npm, pnpm or bun depending on which one you use.

      - name: Setup osquery binaries
        run: yarn setup-osquery

      - name: Sync version across all files
        run: yarn sync-version

      - name: (Mac) Import Apple Developer Certificate
        if: ${{ matrix.runner == 'macos-latest' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: (Mac) Verify Certificate
        if: ${{ matrix.runner == 'macos-latest' }}
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "CERT_ID is $CERT_ID"
          echo "Certificate imported."

      - name: Build Tauri
        env:
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.platform }}" = "ubuntu" ]; then
            # Build Linux bundles (defaults cover .AppImage/.deb/.rpm via bundle.targets=all)
            yarn tauri build ${{ matrix.args }}
          else
            yarn tauri build ${{ matrix.args }}
          fi

      - name: Rename and upload artifacts to single release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)

          # Authenticate gh (uses GITHUB_TOKEN)
          echo "$GITHUB_TOKEN" | gh auth login --with-token >/dev/null 2>&1 || true

          uploaded=()

          # Debug: Show what files are available
          echo "Available files in target directory:"
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.app" -o -name "*.tar.gz" -o -name "*.sig" \) | head -20

          if [ "${{ matrix.platform }}" = "macos-x64" ]; then
            # DMG for x64
            echo "Looking for x86_64 DMG files..."
            echo "Searching in: src-tauri/target/x86_64-apple-darwin"
            echo "All DMG files in target:"
            find src-tauri/target/x86_64-apple-darwin -name "*.dmg" -type f || echo "No DMG files found"
            
            DMG_PATH=$(find src-tauri/target/x86_64-apple-darwin -type f -name "KlaayGuard_*.dmg" | head -n1)
            echo "Found DMG: '${DMG_PATH:-None}'"
            
            if [ -n "${DMG_PATH:-}" ]; then
              RENAMED_DMG="KlaayGuard_${VERSION}_x64_${{ matrix.build }}.dmg"
              cp "$DMG_PATH" "$RENAMED_DMG"
              uploaded+=("$RENAMED_DMG")
              echo "Added to upload: $RENAMED_DMG"
            else
              echo "No DMG file found with pattern 'KlaayGuard_*.dmg'"
              echo "Trying alternative patterns:"
              find src-tauri/target/x86_64-apple-darwin -name "*KlaayGuard*.dmg" -type f || echo "No files with *KlaayGuard*.dmg"
              find src-tauri/target/x86_64-apple-darwin -name "*.dmg" -type f || echo "No .dmg files at all"
            fi
          fi

          if [ "${{ matrix.platform }}" = "macos-arm" ]; then
            # aarch64 .app.tar.gz files (automatically created by Tauri)
            echo "Looking for aarch64 .app.tar.gz files..."
            APP_TGZ_PATH=$(find src-tauri/target/aarch64-apple-darwin -type f -name "KlaayGuard.app.tar.gz" | head -n1)
            echo "Found .app.tar.gz: ${APP_TGZ_PATH:-'None'}"
            if [ -n "${APP_TGZ_PATH:-}" ]; then
              RENAMED_TGZ="KlaayGuard_${VERSION}_aarch64_${{ matrix.build }}.app.tar.gz"
              cp "$APP_TGZ_PATH" "$RENAMED_TGZ"
              uploaded+=("$RENAMED_TGZ")
              echo "Added to upload: $RENAMED_TGZ"
            fi
          fi

          if [ "${{ matrix.platform }}" = "ubuntu" ]; then
            echo "Looking for Linux artifacts (.AppImage/.deb/.rpm)"
            BASE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
            # AppImage
            APPIMAGE=$(find "$BASE_DIR/appimage" -type f -name "*.AppImage" | head -n1 || true)
            if [ -n "${APPIMAGE:-}" ]; then
              RENAMED_APPIMAGE="KlaayGuard_${VERSION}_x86_64_${{ matrix.build }}.AppImage"
              cp "$APPIMAGE" "$RENAMED_APPIMAGE"
              uploaded+=("$RENAMED_APPIMAGE")
              echo "Added to upload: $RENAMED_APPIMAGE"
            fi
            # deb
            DEB=$(find "$BASE_DIR/deb" -type f -name "*.deb" | head -n1 || true)
            if [ -n "${DEB:-}" ]; then
              RENAMED_DEB="KlaayGuard_${VERSION}_x86_64_${{ matrix.build }}.deb"
              cp "$DEB" "$RENAMED_DEB"
              uploaded+=("$RENAMED_DEB")
              echo "Added to upload: $RENAMED_DEB"
            fi
            # rpm
            RPM=$(find "$BASE_DIR/rpm" -type f -name "*.rpm" | head -n1 || true)
            if [ -n "${RPM:-}" ]; then
              RENAMED_RPM="KlaayGuard_${VERSION}_x86_64_${{ matrix.build }}.rpm"
              cp "$RPM" "$RENAMED_RPM"
              uploaded+=("$RENAMED_RPM")
              echo "Added to upload: $RENAMED_RPM"
            fi
          fi

          if [ ${#uploaded[@]} -gt 0 ]; then
            echo "Uploading to release $RELEASE_TAG: ${uploaded[*]}"
            gh release upload "$RELEASE_TAG" "${uploaded[@]}" --clobber
          else
            echo "No artifacts found to upload for matrix=${{ matrix.platform }} ${{ matrix.build }}"
          fi
