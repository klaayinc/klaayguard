name: "publish"

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Determine version
        id: version
        run: |
          echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.version.outputs.VERSION }}
          name: Klaayguard v${{ steps.version.outputs.VERSION }}
          draft: true
          prerelease: false
          allowUpdates: true
          omitBodyDuringUpdate: true
          body: "See the assets to download this version and install."

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build: [development, staging, production]
        platform: [macos-arm, macos-x64]
        include:
          - platform: macos-arm # for Arm based macs (M1 and above).
            runner: macos-latest
            args: "--target aarch64-apple-darwin --bundles app"
          - platform: macos-x64 # for Intel based macs.
            runner: macos-latest
            args: "--target x86_64-apple-darwin"

          - build: development
            api_url: "http://localhost:3000"
          - build: staging
            api_url: "https://api.klaay.dev"
          - build: production
            api_url: "https://api.klaay.com"

          # - platform: ubuntu # for Tauri v1 you could replace this with ubuntu-20.04.
          #   runner: ubuntu-22.04
          #   args: ""
          # - platform: windows
          #   runner: windows-latest
          #   args: ""

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: (Ubuntu) install dependencies
        if: ${{ matrix.runner == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: install frontend dependencies
        run: yarn install # change this to npm, pnpm or bun depending on which one you use.

      - name: (Mac) Import Apple Developer Certificate
        if: ${{ matrix.runner == 'macos-latest' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: (Mac) Verify Certificate
        if: ${{ matrix.runner == 'macos-latest' }}
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "CERT_ID is $CERT_ID"
          echo "Certificate imported."

      - name: Build app with Tauri CLI
        env:
          VITE_API_BASE_URL: ${{ matrix.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          yarn tauri build ${{ matrix.args }}

      - name: Determine version
        id: version
        run: |
          echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Determine architecture label
        id: arch
        run: |
          if [ "${{ matrix.platform }}" = "macos-arm" ]; then
            echo "ARCH=arm64" >> $GITHUB_OUTPUT
          else
            echo "ARCH=x64" >> $GITHUB_OUTPUT
          fi

      - name: Prepare and rename asset
        id: rename
        run: |
          mkdir -p dist
          DMG=$(ls -1 src-tauri/target/**/bundle/dmg/*.dmg | head -n 1)
          if [ -z "$DMG" ]; then
            echo "No DMG found under src-tauri/target/**/bundle/dmg" >&2
            exit 1
          fi
          NEW_NAME="dist/Klaayguard-${{ steps.version.outputs.VERSION }}-${{ steps.arch.outputs.ARCH }}-${{ matrix.build }}.dmg"
          cp "$DMG" "$NEW_NAME"
          echo "asset=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: ${{ steps.rename.outputs.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
