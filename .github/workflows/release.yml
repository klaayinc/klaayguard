name: "publish"
on:
  workflow_dispatch:
  push:
    branches:
      - dev
jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            buildType: prod
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            buildType: prod
          - platform: "ubuntu-22.04"
            args: ""
            buildType: prod
          - platform: "windows-latest"
            args: ""
            buildType: prod
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            buildType: dev
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            buildType: dev
          - platform: "ubuntu-22.04"
            args: ""
            buildType: dev
          - platform: "windows-latest"
            args: ""
            buildType: dev
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # working-directory: klaayguard # Set working directory to klaayguard

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "yarn" # Set this to npm, yarn or pnpm.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target-${{ matrix.buildType }}"

      - name: install frontend dependencies
        run: yarn install # change this to npm or pnpm depending on which one you use.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: ${{ matrix.buildType == 'dev' && 'http://localhost:3000' || '' }}
        with:
          tagName: ${{ matrix.buildType }}-app-v__VERSION__ # Prefix tag with build type
          releaseName: "${{ matrix.buildType }} App v__VERSION__" # Prefix release name with build type
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
