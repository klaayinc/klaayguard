name: CI

# Runs on every pull request (any base branch) and on pushes to the main
# branches, so a change can't merge without passing tests, lint, and a
# warning-free build of every shipped target.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & lint (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # osquery sidecars live in Git LFS and are required for tauri_build to
          # resolve the externalBin resource paths, so the crate won't compile
          # without them.
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ruby ruby-rake

      - name: Verify osquery sidecars (from LFS)
        run: rake

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every target that release actually ships (release-windows is a no-op and
      # release-linux drops arm64, so those are intentionally excluded).
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    env:
      # Fail the build on any compiler warning in our own code. Dependencies are
      # compiled with --cap-lints by cargo, so this only gates first-party code.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ruby ruby-rake

      - name: Verify osquery sidecars (from LFS)
        run: rake

      - name: cargo build (release, warning-free)
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }}
