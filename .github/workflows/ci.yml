name: CI

# Runs on every pull request (any base branch) and on pushes to the main
# branches, so a change can't merge without passing tests, lint, and a
# warning-free build of every shipped target.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & lint (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # osquery sidecars live in Git LFS and are required for tauri_build to
          # resolve the externalBin resource paths, so the crate won't compile
          # without them.
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ruby ruby-rake

      - name: Verify osquery sidecars (from LFS)
        run: rake

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every target that release ships. (release-linux drops arm64, so that one
      # stays excluded.)
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      # Fail the build on any compiler warning in our own code. Dependencies are
      # compiled with --cap-lints by cargo, so this only gates first-party code.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ruby ruby-rake

      # rake (verify) needs Ruby/Unix; on Windows the LFS sidecar is validated by
      # tauri_build during the build below.
      - name: Verify osquery sidecars (from LFS)
        if: runner.os != 'Windows'
        run: rake

      - name: cargo build (release, warning-free)
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }}

  # Build the Linux .deb the way release does and assert on its contents.
  # Every release-blocking packaging defect so far (missing scheme handler,
  # missing %U, stray desktop file, missing postinst) was invisible to
  # cargo build and only surfaced after a release shipped.
  bundle-linux:
    name: Bundle check (Linux deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ruby ruby-rake desktop-file-utils

      - name: Verify osquery sidecars (from LFS)
        run: rake

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4

      - name: Build deb
        working-directory: src-tauri
        run: cargo tauri build --bundles deb

      - name: Validate deb contents
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n1)
          test -n "$DEB"
          ./.github/scripts/validate-linux-deb.sh "$DEB"
