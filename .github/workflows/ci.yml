name: CI

# Runs on every pull request (any base branch) and on pushes to the main
# branches, so PRs can't merge a change that breaks the build or the tests.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & lint (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # osquery sidecars live in Git LFS and are required for tauri_build to
          # resolve the externalBin resource paths, so the crate won't compile
          # without them.
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ruby ruby-rake

      - name: Verify osquery sidecars (from LFS)
        run: rake

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # Formatting and clippy are advisory for now: the existing code is not yet
      # rustfmt-clean and has pre-existing clippy warnings, so failing the build
      # on them today would block every PR. They run on every PR so new issues
      # are visible; tighten (drop continue-on-error) once the codebase is clean.
      - name: cargo fmt --check (advisory)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo fmt --all --check

      - name: cargo clippy (advisory)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo clippy --all-targets
