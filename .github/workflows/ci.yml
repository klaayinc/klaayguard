name: CI

# Runs on every pull request (any base branch) and on pushes to the main
# branches, so a change can't merge without passing tests, lint, and a
# warning-free build of every shipped target.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & lint (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ruby ruby-rake

      - name: Fetch osquery sidecar
        env:
          # Authenticate the osquery release API lookup so it does not hit the
          # unauthenticated 60-req/hr rate limit on shared runner IPs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rake

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny (license compatibility with GPL-3.0)
        working-directory: src-tauri
        run: cargo deny check licenses

  test-macos:
    # The Linux job above never compiles `#[cfg(target_os = "macos")]` code, so
    # until this job existed the macOS tests were written but never run. The
    # single-instance lock and the launchd plist both live behind that gate.
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch osquery sidecar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rake

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Proves the .pkg postinstall's seam still exits without entering the
      # event loop, and that it takes no single-instance lock.
      - name: --install-agent seam
        working-directory: src-tauri
        run: bash scripts/test-install-agent-seam.sh

      # Proves the .pkg postinstall stops the agent it replaces. Without that
      # step the old process keeps running, `open -a` reactivates it, and the
      # Mac reports from the old build until the user logs out.
      - name: postinstall stops the old agent
        working-directory: src-tauri
        run: bash scripts/test-postinstall-stops-agent.sh

      # Proves the .pkg pins its payload to /Applications. Left unwired, this
      # test existed while the installer shipped a relocatable bundle, so a Mac
      # holding another com.klaay.app copy took the app instead.
      - name: pkg structure
        working-directory: src-tauri
        run: bash scripts/test-pkg-structure.sh

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every target that release ships. (release-linux drops arm64, so that one
      # stays excluded.)
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      # Fail the build on any compiler warning in our own code. Dependencies are
      # compiled with --cap-lints by cargo, so this only gates first-party code.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ruby ruby-rake

      # rake fetches the macOS and Linux sidecars. Its file tasks use a Unix
      # shell, so Windows fetches with the PowerShell script instead.
      - name: Fetch osquery sidecar (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rake

      - name: Fetch osquery sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/fetch-osquery-windows.ps1

      - name: cargo build (release, warning-free)
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }}

  # Build the Linux .deb the way release does and assert on its contents.
  # Every release-blocking packaging defect so far (missing scheme handler,
  # missing %U, stray desktop file, missing postinst) was invisible to
  # cargo build and only surfaced after a release shipped.
  bundle-linux:
    name: Bundle check (Linux deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ruby ruby-rake desktop-file-utils rpm

      - name: Fetch osquery sidecar
        env:
          # Authenticate the osquery release API lookup so it does not hit the
          # unauthenticated 60-req/hr rate limit on shared runner IPs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rake

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4

      - name: Build deb and rpm
        working-directory: src-tauri
        run: cargo tauri build --bundles deb rpm

      - name: Validate deb contents
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n1)
          test -n "$DEB"
          ./.github/scripts/validate-linux-deb.sh "$DEB"

      # The rpm ships the same two maintainer scripts, and they branch on rpm's
      # own argument forms. Nothing else in the repository builds one, so
      # without this the branch could rot while the deb stayed green.
      - name: Validate rpm contents
        run: |
          RPM=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" | head -n1)
          test -n "$RPM"
          ./.github/scripts/validate-linux-rpm.sh "$RPM"

      # Proves the postinstall restarts the agent it replaces. Without that
      # step a package upgrade leaves the old process running the old binary,
      # and Linux has no supervisor to notice until the next login. Root,
      # because the postinstall runs as root and starts the agent with runuser.
      - name: postinst restarts the old agent
        working-directory: src-tauri
        run: sudo bash scripts/test-postinst-restarts-agent.sh

  # Build the Windows NSIS installer the way release does, then install it
  # silently on the runner and assert on the result: the Run key, the sidecar,
  # a clean uninstall, and that no klaayguard:// handler is registered. Every
  # one of those is invisible to cargo build.
  bundle-windows:
    name: Bundle check (Windows NSIS)
    runs-on: windows-latest
    # The check drives a real installer. A dialog nobody can answer would
    # otherwise hold the runner for the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc-bundle

      - name: Fetch osquery sidecar
        shell: pwsh
        run: ./.github/scripts/fetch-osquery-windows.ps1

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4

      # Point the build at a dead port. The agent's update loop takes its first
      # tick the moment it starts, and against the production API it finds the
      # current release and installs it — so every assertion below would read a
      # different binary than the one this job built. With no reachable API the
      # check fails harmlessly and the installed 0.1.12 stays 0.1.12.
      - name: Build NSIS installer
        working-directory: src-tauri
        env:
          VITE_API_BASE_URL: http://127.0.0.1:9
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Validate installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer missing" }
          $v = (Get-Content VERSION -Raw).Trim()
          ./.github/scripts/validate-windows-nsis.ps1 -Installer $exe.FullName -Version $v
